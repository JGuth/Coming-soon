<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100" fill="none" aria-label="PipeBand.app Favicon">
  <!-- Official PipeBand.app "pb" Bagpipe Drones Monogram Favicon -->
  <g fill="#FFFFFF" stroke="#FFFFFF">
    <!-- 1. 'b' Loop: Annular ring (Outer R 280, Inner R 160 at center 710, 560) -->
    <circle cx="710" cy="560" r="220" stroke-width="120" fill="none" />

    <!-- 2. 'b' Vertical Ascender (Stem) -->
    <path
      d="M 445 295 L 445 170 C 445 105, 490 60, 550 60 L 550 330 C 515 330, 480 310, 445 295 Z"
      fill="#FFFFFF"
      stroke="none"
    />

    <!-- 3. 'p' Descender & Left Stem with Semicircular Bottom Terminal -->
    <path
      d="M 80 430 L 80 925"
      stroke-width="112"
      stroke-linecap="round"
      fill="none"
    />

    <!-- 4. 'p' Upper Bowl Arch (Over the circular counter at 275, 520) -->
    <path
      d="M 80 430 C 80 255, 190 255, 275 255 C 355 255, 420 270, 445 295"
      stroke-width="112"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- 5. 'p' Lower Bowl & Sweeping Tail with Rounded Terminal Cap -->
    <path
      d="M 135 600 C 135 730, 220 765, 300 765 C 370 765, 430 735, 465 675"
      stroke-width="112"
      stroke-linecap="round"
      fill="none"
    />

    <!-- 6. Solid Junction Divider between 'p' and 'b' counters -->
    <path
      d="M 415 340 L 550 330 L 550 560 L 415 520 Z"
      fill="#FFFFFF"
      stroke="none"
    />

    <!-- 7. Bass Drone (Vertical, Center X 688) -->
    <!-- Stock collar on 'b' rim -->
    <path d="M 668 281 C 668 265, 708 265, 708 281 Z" stroke="none" />
    <!-- Shaft, Tuning Slide Ferrule, Neck, Flared Bell & Top Cap -->
    <path
      d="
        M 684 257
        L 684 218
        L 674 218
        L 674 212
        L 676 212
        L 676 60
        L 661 55
        L 661 16
        L 715 16
        L 715 55
        L 700 60
        L 700 212
        L 702 212
        L 702 218
        L 692 218
        L 692 257
        Z
      "
      stroke="none"
    />

    <!-- 8. Tenor Drone 1 (Angled 18 deg clockwise, Center 794, 293) -->
    <g transform="translate(794, 293) rotate(18)">
      <!-- Stock collar on rim -->
      <path d="M -20 0 C -20 -16, 20 -16, 20 0 Z" stroke="none" />
      <!-- Shaft, Slide Ferrule, Neck, Flared Bell & Top Cap -->
      <path
        d="
          M -10 -24
          L -10 -60
          L -12 -60
          L -12 -66
          L -10 -66
          L -10 -170
          L -22 -175
          L -22 -204
          L 22 -204
          L 22 -175
          L 10 -170
          L 10 -66
          L 12 -66
          L 12 -60
          L 10 -60
          L 10 -24
          Z
        "
        stroke="none"
      />
    </g>

    <!-- 9. Tenor Drone 2 (Angled 36 deg clockwise, Center 874, 332) -->
    <g transform="translate(874, 332) rotate(36)">
      <!-- Stock collar on rim -->
      <path d="M -20 0 C -20 -16, 20 -16, 20 0 Z" stroke="none" />
      <!-- Shaft, Slide Ferrule, Neck, Flared Bell & Top Cap -->
      <path
        d="
          M -10 -24
          L -10 -60
          L -12 -60
          L -12 -66
          L -10 -66
          L -10 -170
          L -22 -175
          L -22 -204
          L 22 -204
          L 22 -175
          L 10 -170
          L 10 -66
          L 12 -66
          L 12 -60
          L 10 -60
          L 10 -24
          Z
        "
        stroke="none"
      />
    </g>
  </g>
</svg>
