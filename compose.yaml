services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pipeband-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/pipeband_signups.db
      - RATE_LIMIT_SALT=${RATE_LIMIT_SALT:-change_me_in_production}
    volumes:
      # Persistent SQLite storage outside the container filesystem
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
